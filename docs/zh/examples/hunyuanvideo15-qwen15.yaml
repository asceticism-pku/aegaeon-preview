# xinjin2 GPU 1 test configuration. The fixed 8 GiB CUDA arena is selected
# outside YAML with AEGAEON_ARENA_FRACTION=0.20. Also set
# CUDA_VISIBLE_DEVICES=1 and AEGAEON_CUDA_VISIBLE_DEVICES=1.
server:
  nnodes: 1
  num_engines: 1
  num_prefill_engines: 0
  num_decode_engines: 0
  tensor_parallel_size: 1
  worker_num_cpus: 4
  cpu_num_slabs: 1
  cpu_slab_size_bytes: 268435456
  model_cache_size_gb: 4
  memory_utilization: 0.20
  dummy_weights: false
  startup_models: [Qwen/Qwen2.5-1.5B-Instruct]
  model_placement_policy: least-loaded
  request_routing_policy: least-outstanding
  cuda_graph:
    mode: 'off'
models:
- name: Qwen/Qwen2.5-1.5B-Instruct
  path: /users/shared/Models/Qwen/Qwen2.5-1.5B-Instruct
  profile: Qwen/Qwen2.5-1.5B-Instruct
  max_model_len: 4096
devices:
- name: A100_40GB
  memory: 39
  bandwidth: 32
  profile: A100-PCIE-40GB
